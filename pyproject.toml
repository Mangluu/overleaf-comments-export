[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "overleaf-comments-export"
version = "0.2.0"
description = "Export comment threads and tracked changes from an Overleaf project to Markdown + JSON, optimized for AI-agent consumption."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Shivang" },
]
keywords = [
    "overleaf",
    "latex",
    "research",
    "comments",
    "review",
    "academic",
    "tracked-changes",
    "ai-agents",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup :: LaTeX",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "pyoverleaf>=0.1.7",
    "browser-cookie3>=0.19",
    "requests>=2.31",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
gui = [
    # tkinter ships with Python; sv-ttk adds a modern look-and-feel.
    "sv-ttk>=2.6",
]
test = [
    "pytest>=8.0",
]

[project.scripts]
overleaf-comments-export = "overleaf_comments_export.__main__:main"

[project.urls]
Homepage = "https://github.com/Mangluu/overleaf-comments-export"
Issues = "https://github.com/Mangluu/overleaf-comments-export/issues"
Source = "https://github.com/Mangluu/overleaf-comments-export"

[tool.setuptools.packages.find]
where = ["."]
include = ["overleaf_comments_export*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
