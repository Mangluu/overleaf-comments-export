[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "overleaf-comments-export"
version = "0.21.0"
description = "Export comment threads and tracked changes from an Overleaf project to Markdown + JSON, optimized for AI-agent consumption."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Shivang Gupta", email = "47645533+Mangluu@users.noreply.github.com" },
]
keywords = [
    "overleaf",
    "latex",
    "research",
    "comments",
    "review",
    "academic",
    "tracked-changes",
    "ai-agents",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Markup :: LaTeX",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "pyoverleaf>=0.1.7",
    "browser-cookie3>=0.19",
    "requests>=2.31",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
all = [
    "sv-ttk>=2.6",
    "pymupdf>=1.24",
]
gui = [
    # NOTE: tkinter itself cannot be installed from PyPI. It ships with the
    # python.org installers, but most Linux distributions package it
    # separately (python3-tk / python3-tkinter / tk). The CLI never needs it,
    # and `--gui` explains how to install it if it is missing.
    "sv-ttk>=2.6",
]
pdf = [
    # Writes the comments into the PDF Overleaf built, so no LaTeX
    # installation is needed to get a commented PDF.
    "pymupdf>=1.24",
]
test = [
    "pytest>=8.0",
    "pymupdf>=1.24",
    # Only so the workflow files can be checked for being parseable. A broken
    # one shows up in the Actions list as a filename with no log, which is
    # easy to miss and means nothing ran.
    "pyyaml>=6.0",
]

[project.scripts]
overleaf-comments-export = "overleaf_comments_export.__main__:main"

[project.urls]
Homepage = "https://github.com/Mangluu/overleaf-comments-export"
Issues = "https://github.com/Mangluu/overleaf-comments-export/issues"
Source = "https://github.com/Mangluu/overleaf-comments-export"

[tool.setuptools.packages.find]
where = ["."]
include = ["overleaf_comments_export*"]

[tool.setuptools]
include-package-data = true

[tool.pytest.ini_options]
testpaths = ["tests"]
