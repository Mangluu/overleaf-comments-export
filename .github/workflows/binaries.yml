name: Build downloadable apps

# Builds a double-clickable application for each operating system and attaches
# it to the release, so people who do not use Python can still run this.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the apps to, for example v0.8.0"
        required: false

# Uploading the built apps to the release needs write access; the default token
# is read-only.
permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS
            asset: OverleafCommentsExport-macOS.zip
          - os: windows-latest
            label: Windows
            asset: OverleafCommentsExport-Windows.zip
          - os: ubuntu-latest
            label: Linux
            asset: OverleafCommentsExport-Linux.zip

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the app and PyInstaller
        run: |
          python -m pip install --upgrade pip
          # The pdf extra matters here more than anywhere: these apps exist
          # for people who do not have Python, and putting the comments into
          # the PDF is the reason most of them will open it.
          python -m pip install ".[gui,pdf]" pyinstaller

      - name: Build
        shell: bash
        run: |
          pyinstaller \
            --name "Overleaf Comments Export" \
            --windowed --noconfirm --clean \
            --paths . \
            --collect-submodules overleaf_comments_export \
            --collect-all sv_ttk \
            --collect-submodules browser_cookie3 \
            --collect-all pymupdf \
            --osx-bundle-identifier com.mangluu.overleaf-comments-export \
            packaging/app_entry.py

      - name: Add a readme people will actually see
        shell: bash
        run: |
          cat > dist/"How to open this.txt" <<'TXT'
          Overleaf Comments Export

          macOS
            The first time only: right-click the app, choose Open, then Open
            again. macOS warns about apps it has not checked; this one is not
            signed, because a signing certificate costs money every year.

          Windows
            The first time only: Windows may say "Windows protected your PC".
            Click "More info", then "Run anyway".

          Linux
            Make it executable if it is not already:
              chmod +x "Overleaf Comments Export"

          Nothing is uploaded anywhere. Everything happens on your computer.
          Source and help: https://github.com/Mangluu/overleaf-comments-export
          TXT

      - name: Package
        shell: bash
        run: |
          cd dist
          case "${{ runner.os }}" in
            macOS)
              # A .app is full of symlinks. zip -y stores them as symlinks; any
              # tool that follows them instead produces a bundle that looks
              # complete and refuses to start.
              rm -rf "Overleaf Comments Export"
              zip -r -q -y "../${{ matrix.asset }}" \
                "Overleaf Comments Export.app" "How to open this.txt"
              ;;
            Linux)
              zip -r -q -y "../${{ matrix.asset }}" .
              ;;
            *)
              # Windows runners have no zip, and nothing there uses symlinks.
              python -c "import shutil,sys; shutil.make_archive(sys.argv[1], 'zip', '.')" \
                "../$(basename "${{ matrix.asset }}" .zip)"
              ;;
          esac
          ls -la "../${{ matrix.asset }}"

      - name: Attach it to the release
        if: github.event_name == 'release' || inputs.tag != ''
        # bash on every runner: the Windows default is PowerShell, where $TAG
        # is not an environment variable and silently expands to nothing.
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" "${{ matrix.asset }}" --clobber

      - name: Keep it as an artifact too
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
