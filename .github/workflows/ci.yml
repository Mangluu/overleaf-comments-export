name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + test extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run pytest
        run: python -m pytest tests/ -v

  window:
    # The window is what most people who download this actually use, and its
    # tests skip themselves unless OCE_GUI_TESTS is set, so nothing had ever
    # run them automatically. Linux needs a virtual display, which xvfb gives.
    #
    # macOS used to be in this matrix, on the assumption that the runner has a
    # display of its own. It does not. A hosted macOS runner has no logged-in
    # window server session, so Tk blocks on the first window it opens and the
    # job never finishes. It was cancelled on every single run it ever had, so
    # it reported nothing while billing macOS minutes at ten times the Linux
    # rate. A test that has never once produced a result is not coverage.
    #
    # The Tk code under test is the same on both, so xvfb on Linux exercises
    # it. What is genuinely macOS specific is the .app bundle, and that is
    # built and opened by hand in packaging/, not here.
    name: Window on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Tk and a virtual display
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb

      - name: Install package + test extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,gui]"

      - name: Run the window tests
        env:
          OCE_GUI_TESTS: "1"
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a python -m pytest tests/test_gui.py -v
          else
            python -m pytest tests/test_gui.py -v
          fi

      - name: The window has to at least open
        env:
          OCE_GUI_TESTS: "1"
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a python tests/smoke_window.py
          else
            python tests/smoke_window.py
          fi

  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build
        run: python -m pip install --upgrade pip build

      - name: Build distributions
        run: python -m build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
