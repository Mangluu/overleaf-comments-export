name: Publish to PyPI

# Tag push is the single trigger. Publishing on `release: published` as well
# would fire a second, duplicate run for every release (a release always has a
# tag), and PyPI rejects re-uploading a version that already exists.
on:
  push:
    tags:
      - "v*.*.*"

# Uses PyPI's "Trusted Publishers" flow — no secret tokens needed once you
# register this repo at https://pypi.org/manage/account/publishing/
permissions:
  contents: read
  id-token: write

jobs:
  # CI runs on pushes to main. A tag push is a different event, so CI does not
  # run on it at all, and this workflow used to publish to PyPI without any
  # test having passed on the thing being published. On 0.19.0 the upload
  # finished about 35 seconds before CI on the same commit did.
  #
  # The tests run here, in the same workflow, so publishing genuinely waits
  # for them. Building the wheel in CI and promoting it across workflows would
  # avoid running the suite twice, but it needs artifact plumbing between two
  # events for a saving of about a minute, and this actually gates.
  test:
    name: Test before publishing
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + test extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Run pytest
        run: python -m pytest tests/ -q

  publish:
    name: Build + publish
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/overleaf-comments-export
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build
        run: python -m pip install --upgrade pip build

      - name: Build distributions
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # A re-run (manual retry, re-tag) becomes a no-op instead of a
          # failure when the version is already on PyPI.
          skip-existing: true
