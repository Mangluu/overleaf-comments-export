name: Publish to PyPI

on:
  push:
    tags:
      - "v*.*.*"
  release:
    types: [published]

# Uses PyPI's "Trusted Publishers" flow — no secret tokens needed once you
# register this repo at https://pypi.org/manage/account/publishing/
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build + publish
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/overleaf-comments-export
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build
        run: python -m pip install --upgrade pip build

      - name: Build distributions
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
