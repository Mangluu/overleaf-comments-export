name: Browser extension

on:
  push:
    paths:
      - "browser-extension/**"
      - ".github/workflows/browser-extension.yml"
  pull_request:
    paths:
      - "browser-extension/**"
      - ".github/workflows/browser-extension.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: browser-extension

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run check
      - run: npm test
