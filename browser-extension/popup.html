<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Overleaf Comments Export</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <img class="mark" src="icons/icon128.png" alt="" width="43" height="43">
        <div>
          <p class="eyebrow">OVERLEAF TOOL</p>
          <h1 data-i18n="title">Export project comments</h1>
        </div>
      </header>

      <div class="language-picker">
        <label class="language-label" for="language-select">
          <span aria-hidden="true">🌐</span>
          <span data-i18n="languageLabel">Language</span>
        </label>
        <select id="language-select" class="language-select"></select>
      </div>

      <section id="page-card" class="page-card" aria-live="polite">
        <span id="page-indicator" class="indicator"></span>
        <div>
          <p id="page-state" class="page-state" data-i18n="checkingPage">Checking the current tab…</p>
          <p id="page-detail" class="page-detail"></p>
        </div>
      </section>

      <fieldset id="options" disabled>
        <legend data-i18n="includeLegend">Include</legend>
        <label class="toggle-row">
          <span>
            <strong data-i18n="resolvedTitle">Resolved comments</strong>
            <small data-i18n="resolvedHelp">Also export discussions marked as resolved</small>
          </span>
          <input id="include-resolved" type="checkbox" checked>
        </label>
        <label class="toggle-row">
          <span>
            <strong data-i18n="changesTitle">Tracked changes</strong>
            <small data-i18n="changesHelp">Include insertion and deletion records</small>
          </span>
          <input id="include-changes" type="checkbox" checked>
        </label>
      </fieldset>

      <details id="scope" class="scope">
        <summary data-i18n="scopeLegend">Narrow it down</summary>
        <label class="toggle-row">
          <span>
            <strong data-i18n="currentFileTitle">This file only</strong>
            <small data-i18n="currentFileHelp">Just the document open in the editor</small>
          </span>
          <input type="checkbox" id="scope-current">
        </label>
        <label class="toggle-row">
          <span>
            <strong data-i18n="reviewerTitle">One person</strong>
            <small data-i18n="reviewerHelp">Only threads this person took part in</small>
          </span>
        </label>
        <input type="search" id="scope-reviewer" class="reviewer"
               data-i18n-placeholder="reviewerPlaceholder"
               placeholder="Leave empty for everyone">
      </details>

      <fieldset id="formats" disabled>
        <legend data-i18n="outputLegend">Output files</legend>
        <div class="format-grid">
          <label><input id="format-md" type="checkbox" checked> Markdown</label>
          <label><input id="format-json" type="checkbox" checked> JSON</label>
          <label><input id="format-jsonl" type="checkbox"> JSONL</label>
          <label><input id="format-xlsx" type="checkbox"> <span data-i18n="formatXlsx">Spreadsheet</span></label>
          <label><input id="format-letter" type="checkbox"> <span data-i18n="responseLetter">Response letter</span></label>
        </div>
      </fieldset>

      <button id="export" type="button" disabled>
        <span id="button-label" data-i18n="exportButton">Export current project</span>
        <span id="spinner" class="spinner" hidden aria-hidden="true"></span>
      </button>

      <p id="progress" class="progress" hidden aria-live="polite"></p>
      <button id="stop" type="button" class="stop" hidden>Stop</button>

      <section id="result" class="result" hidden aria-live="polite"></section>
      <button id="copy" type="button" class="copy" hidden>Copy the Markdown</button>

      <p class="repo-note">
        <a id="repo-link" href="https://github.com/Mangluu/overleaf-comments-export" target="_blank" rel="noreferrer"
           data-i18n="repoLink">Free and open source. Star it on GitHub ★</a>
      </p>

      <p class="privacy-note" data-i18n="privacyNote">Data is read only from the current tab and downloaded locally. The extension never reads, stores, or uploads your login cookie.</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
